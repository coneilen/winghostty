name: Test

on:
  push: {}
  pull_request: {}
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_interactive_win11:
        description: Run the full hosted Windows Server CPU GUI suite
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build And Tests
    runs-on: windows-2022
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}\.zig-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Flagship verification contract checks
        shell: pwsh
        run: ./test/windows/flagship/Test-VerificationContracts.ps1

      - name: Site copy checks
        shell: pwsh
        run: ./scripts/check-site-copy.ps1

      - name: Release copy checks
        shell: pwsh
        run: ./scripts/check-release-copy.ps1

      - name: Release copy UTC date tests (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-release-copy-date.ps1

      - name: Release copy UTC date tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-release-copy-date.ps1

      - name: Remote release copy checks
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-copy.ps1 -CheckRemoteLatest

      - name: Install site dependencies
        shell: pwsh
        run: npm ci --prefix site

      - name: Deterministic site bundle check
        shell: pwsh
        run: ./scripts/check-site-bundle.ps1

      - name: Signing trust policy tests
        shell: pwsh
        run: ./scripts/test-signing-trust.ps1

      - name: Windows build capability manifest tests
        shell: pwsh
        run: ./scripts/test-windows-build-capabilities.ps1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Failed and cancelled jobs can save incomplete generated files.
          use-cache: false

      - name: Dependency download regression tests (PowerShell 7)
        shell: pwsh
        run: ./test/windows/zig-dependency-download.ps1

      - name: Dependency download regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./test/windows/zig-dependency-download.ps1

      - name: Seed Windows Zig dependencies
        shell: pwsh
        run: .\scripts\dev-windows.cmd powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\fetch-zig-deps.ps1

      - name: Zig cache volume regression check
        shell: pwsh
        run: ./test/windows/zig-cache-same-drive.ps1

      - name: CMD Zig cache cross-drive regression check
        shell: pwsh
        run: ./test/windows/zig-cache-cmd-cross-drive.ps1

      - name: Zig offline cache-consumption regression check
        shell: pwsh
        run: ./test/windows/zig-cache-offline-build.ps1

      - name: Zig offline cache-consumption regression check (Windows PowerShell 5.1)
        shell: powershell
        run: ./test/windows/zig-cache-offline-build.ps1

      - name: Win32 host API external compile/layout contract
        shell: pwsh
        run: ./test/windows/compile-win32-host-api.ps1

      - name: Win32 host API lifecycle smoke
        shell: pwsh
        run: ./test/windows/run-win32-host-api-smoke.ps1

      - name: Win32 host API input caller-loop smoke
        shell: pwsh
        run: ./test/windows/run-win32-host-api-input.ps1

      - name: Win32 host renderer contract
        shell: pwsh
        run: ./test/windows/run-win32-host-renderer.ps1

      - name: Zig version
        run: zig version

      - name: Zig formatting
        shell: pwsh
        run: ./scripts/check-zig-format.ps1

      - name: PowerShell syntax and JSON validity
        shell: pwsh
        run: ./scripts/check-source-format.ps1

      - name: Full Zig test suite
        run: zig build test -Demit-test-exe=true

      - name: Custom shader compiler tests
        run: zig build test -Dtest-filter=shadertoy -Dcustom-shaders=true

      - name: Native Win32 compositor tests
        run: zig test src/apprt/win32_compositor_native.zig -lc -luser32 -lkernel32

      - name: Win32 glyph raster tests
        run: zig test src/renderer/win32_glyph.zig -lc -lgdi32 -lkernel32 -luser32

      - name: Win32 host snapshot ABI tests
        run: zig test src/win32_host.zig -lc -luser32 -lkernel32 -lgdi32 -lopengl32 -lole32 -loleaut32

      - name: Build executable
        # This traverses the default build graph too; a preceding plain
        # `zig build` duplicated the same Windows compile/link work.
        run: zig build -Demit-exe=true

      - name: Verify default source-build shader mode
        shell: pwsh
        run: |
          $versionText = & .\zig-out\bin\winghostty.com +version | Out-String
          Write-Host $versionText
          if ($LASTEXITCODE -ne 0) {
            throw "winghostty.com +version failed with exit code $LASTEXITCODE."
          }
          if ($versionText -notmatch "Build Config" -or
              $versionText -notmatch "custom shaders: disabled") {
            throw "Default source build did not report disabled custom shaders."
          }

      - name: Build ARM64 executable
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
        # Cross-compilation coverage only; native execution runs in windows-arm64.yml.
        run: zig build -Demit-exe=true -Dtarget=aarch64-windows-msvc -Dcpu=baseline

  windows-portable-smoke:
    name: Windows x64 Portable Package Smoke
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}\.zig-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Zig cache volume regression check
        shell: pwsh
        run: ./test/windows/zig-cache-same-drive.ps1

      - name: Run portable package CLI smoke
        shell: pwsh
        run: ./test/windows/flagship/Invoke-PortableSmoke.ps1

      - name: Upload portable smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flagship-portable-x64-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test/windows/flagship/artifacts/portable-x64
            dist/artifacts/winghostty-0.0.1-windows-x64

  windows-interactive:
    name: Windows 11 Interactive Composite
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_interactive_win11)
    # Historical required-check name retained above; this is Server CPU
    # correctness evidence, NOT Windows 11 client or hardware/release proof.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.zig-global-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}\.zig-cache
      WINGHOSTTY_EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          # Ephemeral retries must start clean. setup-zig saves failed local
          # caches and otherwise restores the broken build runner on retry.
          use-cache: false

      - name: Prove interactive runner provenance
        shell: pwsh
        env:
          WINGHOSTTY_EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .\test\windows\assert-interactive-runner.ps1 -Profile HostedServerCpu -OutputPath "$env:GITHUB_WORKSPACE\.sandbox\hosted-ci\evidence\runner.json"

      - name: Hosted profile headless contract tests
        shell: pwsh
        run: .\test\windows\test-hosted-interactive.ps1

      - name: Run interactive Win11 composite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\test\windows\run-hosted-interactive.ps1 -EventName '${{ github.event_name }}'

      - name: Verify complete hosted Server CPU evidence
        shell: pwsh
        run: .\test\windows\assert-hosted-interactive-evidence.ps1 -EvidencePath "$env:GITHUB_WORKSPACE\.sandbox\hosted-ci\evidence\result.json"

      - name: Upload interactive evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hosted-windows-server-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            test/windows/flagship/artifacts/interactive-win11
            ${{ github.workspace }}/.sandbox/win11/**/logs/**
            ${{ github.workspace }}/.sandbox/hosted-ci/evidence/**
            ${{ github.workspace }}/.sandbox/hosted-ci/mesa/notices/**
